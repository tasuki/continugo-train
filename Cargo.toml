[package]
name = "continugo-train"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "continugo-train"

[features]
reference-rules = ["continugo-rules/reference"]
reference-eyes = ["continugo-analysis/reference"]

[dependencies]
continugo-rules = { path = "../continugo/backend/rules" }
continugo-analysis = { path = "../continugo/backend/analysis" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
