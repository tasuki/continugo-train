[tools]
rust = "1.99.1"
python = "3.13.5"

[tasks.setup]
description = "Fetch Rust dependencies and install the Python environment"
run = [
  "cargo fetch",
  "cargo build --locked --release --bin features",
  "python -m venv .venv",
  '.venv/bin/python -m pip install torch==2.7.1 --index-url "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu118}"',
  ".venv/bin/python -m pip install -e '.[dev,inference]'",
]

[tasks.test]
description = "Test shared rules, analysis, and training infrastructure"
run = [
  "cargo test --locked --workspace --manifest-path ../continugo/backend/Cargo.toml",
  "cargo test --locked",
  "cargo build --locked --release --bins",
  ".venv/bin/python -m unittest discover -s tests -p 'test_*.py'",
]

[tasks.check]
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  ".venv/bin/ruff check python tests",
  ".venv/bin/ruff format --check python tests",
]

[tasks.format]
run = ["cargo fmt", ".venv/bin/ruff format python tests"]

[tasks.build-features]
description = "Build the authoritative Rust-to-PyTorch feature bridge"
run = "cargo build --locked --release --bin features"

[tasks.features]
description = "Extract real position tensors from SGF (binary stdout by default)"
run = "cargo run --locked --release --bin features --"

[tasks.train]
description = "Offline PyTorch training from completed MCTS SGFs"
depends = ["build-features"]
run = ".venv/bin/python -m continugo_train.train"

[tasks.export]
description = "Export and verify a checkpoint as portable ONNX graphs"
run = ".venv/bin/python -m continugo_train.export"

[tasks.neural-selfplay]
description = "Native CPU ONNX-guided MCTS (runtime from the Python wheel by default)"
run = 'ORT_DYLIB_PATH="${ORT_DYLIB_PATH:-$(.venv/bin/python -m continugo_train.export --runtime-path)}" cargo run --locked --release -- --engine neural'

[tasks.model-bench]
description = "Benchmark synthetic coarse/dense inference and training (FP32)"
run = ".venv/bin/python -m continugo_train.benchmark"

[tasks.selfplay]
description = "Generate baseline MCTS games (arguments are forwarded)"
run = "cargo run --locked --release --"

[tasks.smoke]
description = "Short pipeline check; output games may be truncated"
run = "cargo run --locked --release -- --games 2 --sizes 9,19 --max-moves 12 --simulations 16"
