[tools]
rust = "1.99.1"
python = "3.13.5"

[tasks.setup]
description = "Fetch Rust dependencies and install the Python environment"
run = [
  "cargo fetch",
  "cargo build --locked --release --bin features",
  "python -m venv .venv",
  '.venv/bin/python -m pip install torch==2.7.1 --index-url "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu118}"',
  ".venv/bin/python -m pip install -e '.[dev,inference]'",
]

[tasks.test]
description = "Test shared rules, analysis, and training infrastructure"
run = [
  "cargo test --locked --workspace --manifest-path ../continugo/backend/Cargo.toml",
  "cargo test --locked",
  "cargo build --locked --release --bins",
  ".venv/bin/python -m unittest discover -s tests -p 'test_*.py'",
]

[tasks.check]
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  ".venv/bin/ruff check python tests",
  ".venv/bin/ruff format --check python tests",
]

[tasks.format]
run = ["cargo fmt", ".venv/bin/ruff format python tests"]

[tasks.build-features]
description = "Build the authoritative Rust-to-PyTorch feature bridge"
run = "cargo build --locked --release --bin features"

[tasks.features]
description = "Extract real position tensors from SGF (binary stdout by default)"
run = "cargo run --locked --release --bin features --"

[tasks.train]
description = "Offline PyTorch training from completed MCTS SGFs"
depends = ["build-features"]
run = ".venv/bin/python -m continugo_train.train"

[tasks.build-loop]
description = "Build native self-play and authoritative feature binaries"
run = "cargo build --locked --release --bin continugo-train --bin features --bin arena --bin rating"

[tasks.loop]
description = "Restartable neural self-play, bounded replay, warm-start and export loop"
depends = ["build-loop"]
run = ".venv/bin/python -m continugo_train.loop"

[tasks.plot-metrics]
description = "Plot saved training/validation losses from a campaign, loop or offline job"
run = ".venv/bin/python -m continugo_train.plot_metrics"

[tasks.loop-status]
description = "Read-only training, experimental actor, accepted identity and live loop progress"
run = ".venv/bin/python -m continugo_train.status"

[tasks.promote]
description = "Explicit user-approved publication of one hash-pinned experimental checkpoint"
run = ".venv/bin/python -m continugo_train.promote"

[tasks.export]
description = "Export and verify a checkpoint as portable ONNX graphs"
run = ".venv/bin/python -m continugo_train.export"

[tasks.setup-gpu]
description = "Install isolated Pascal-compatible ONNX CUDA 11.8 inference dependencies"
run = ".venv/bin/python -m continugo_train.runtime setup"

[tasks.neural-selfplay]
description = "Native ONNX-guided MCTS (CUDA by default; --device cpu for CPU)"
run = ".venv/bin/python -m continugo_train.runtime selfplay"

[tasks.arena]
description = "Paired-color candidate/incumbent evaluation (40/40/20 board mix)"
run = ".venv/bin/python -m continugo_train.runtime arena"

[tasks.ratings]
description = "Refresh/migrate ratings; view networks, --matches, or --sgf HASH; optionally ingest arena SGFs"
depends = ["build-loop"]
run = ".venv/bin/python -m continugo_train.ratings"

[tasks.infer]
description = "Native ONNX diagnostics (CUDA by default; --device cpu for CPU)"
run = ".venv/bin/python -m continugo_train.runtime infer"

[tasks.model-bench]
description = "Benchmark synthetic coarse/selected-cell inference and training (FP32)"
run = ".venv/bin/python -m continugo_train.benchmark"

[tasks.pipeline-profile]
description = "Profile real 9/13/19 positions, neural self-play, feature transport and SGD"
run = [
  "cargo build --locked --release --bins",
  ".venv/bin/python -m continugo_train.pipeline_profile",
]

[tasks.selfplay]
description = "Generate baseline MCTS games (arguments are forwarded)"
run = "cargo run --locked --release --"

[tasks.smoke]
description = "Short pipeline check; output games may be truncated"
run = "cargo run --locked --release -- --games 2 --sizes 9,19 --max-moves 12 --simulations 16"
